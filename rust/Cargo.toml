[workspace]
members = [
    "crates/openrtb",
    "crates/openrtb-ext",
    "crates/config",
    "crates/util",
    "crates/adapters",
    "crates/currency",
    "crates/metrics",
    "crates/exchange",
    "crates/endpoints",
    "crates/server",
]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
config = "0.14"
prometheus = { version = "0.13", features = ["process"] }
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1", features = ["v4"] }
jsonschema = "0.17"
json-patch = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
bytes = "1"
http = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
dashmap = "5"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
flate2 = "1.0"
