name: Rust CI

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "Dockerfile.rust"
      - "sample/rust/**"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "Dockerfile.rust"
      - "sample/rust/**"

jobs:
  build-and-test:
    name: Build and test Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --workspace --manifest-path rust/Cargo.toml

      - name: cargo test (unit, skip integration)
        run: cargo test --workspace --manifest-path rust/Cargo.toml --lib -- --skip integration

      - name: cargo clippy
        run: |
          cargo clippy --workspace --manifest-path rust/Cargo.toml -- \
            -D warnings \
            -A dead_code \
            -A unused_variables \
            -A unused_imports \
            -A unused_mut \
            -A clippy::dead_code \
            -A unused_assignments

  docker-build:
    name: Build Dockerfile.rust
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.rust (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          push: false
          load: false
          tags: prebid-server-rust:ci
